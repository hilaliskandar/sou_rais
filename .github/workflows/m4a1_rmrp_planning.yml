name: M4A1 RMRP planning dry-run

on:
  push:
    branches: [m4a1-rmrp-planning-harness]
  pull_request:
    branches: [main]
    paths:
      - 'harness/rmrp/**'
      - 'scripts/m4a1_rmrp_planning_harness.py'
      - '.github/workflows/m4a1_rmrp_planning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run planning harness
        run: python scripts/m4a1_rmrp_planning_harness.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4a1-rmrp-planning-dryrun
          path: artifacts/m4a1_rmrp_planning
          if-no-files-found: error
          retention-days: 90
