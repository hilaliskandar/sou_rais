name: tests

on:
  push:
  pull_request:

jobs:
  pytest-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Atualiza pip
        run: python -m pip install --upgrade pip
      - name: Instala projeto e dependências de desenvolvimento
        run: pip install -e ".[dev]"
      - name: Testa CLI instalada em modo editável
        run: sou-rais --help
      - name: Executa testes unitários
        run: pytest -q
      - name: Gera sdist e wheel
        run: python -m build
      - name: Verifica metadados da distribuição
        run: python -m twine check dist/*
      - name: Testa instalação limpa do wheel
        run: |
          python -m venv /tmp/sou-rais-wheel-test
          /tmp/sou-rais-wheel-test/bin/pip install --upgrade pip
          /tmp/sou-rais-wheel-test/bin/pip install dist/*.whl
          /tmp/sou-rais-wheel-test/bin/sou-rais --help
