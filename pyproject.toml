[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sou-rais"
version = "0.1.0"
description = "Aquisição reproduzível de RAIS, Novo CAGED e snapshots do CNPJ por municípios"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["RAIS", "CAGED", "CNPJ", "BigQuery", "Brasil", "mercado de trabalho", "dados públicos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "google-cloud-bigquery",
  "pandas",
  "pyarrow",
  "db-dtypes",
  "tqdm"
]

[project.urls]
Homepage = "https://github.com/hilaliskandar/sou_rais"
Repository = "https://github.com/hilaliskandar/sou_rais"
Issues = "https://github.com/hilaliskandar/sou_rais/issues"
Changelog = "https://github.com/hilaliskandar/sou_rais/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "jupyter", "build", "twine"]

[project.scripts]
sou-rais = "sou_rais_cli:main"

[tool.setuptools]
py-modules = ["sou_rais", "sou_rais_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
